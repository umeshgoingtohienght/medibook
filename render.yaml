# Render Blueprint — New → Blueprint → select this repo
services:
  - type: web
    name: medibook-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false # your Vercel URL
